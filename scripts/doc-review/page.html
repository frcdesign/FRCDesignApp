/>
<style>
    /* A reading desk: pick a file from a sheet, then a section of it from tabs; one section on screen at a time. */
    :root {
        --bg: #f6f7f4;
        --surface: #ffffff;
        --fg: #1d221d;
        --muted: #5f6a60;
        --rule: #dfe3dc;
        --accent: #2f7d3b;
        --accent-soft: #e3f0e3;
        --added: #e6f4e6;
        --added-fg: #1f5f29;
        --removed: #fbe9e7;
        --removed-fg: #8a2a1e;
        --mark: #fff4cc;
        --code-bg: #eef1ec;
        --scrim: rgba(20, 26, 20, 0.45);
        --font-body:
            "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display:
            "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
        --font-mono:
            "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #151915;
            --surface: #1c211c;
            --fg: #e4e9e2;
            --muted: #9aa69a;
            --rule: #2e352e;
            --accent: #7cc489;
            --accent-soft: #24372a;
            --added: #1d3322;
            --added-fg: #9fdcaa;
            --removed: #3a2220;
            --removed-fg: #f0a99e;
            --mark: #3a3418;
            --code-bg: #252b25;
            --scrim: rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #151915;
        --surface: #1c211c;
        --fg: #e4e9e2;
        --muted: #9aa69a;
        --rule: #2e352e;
        --accent: #7cc489;
        --accent-soft: #24372a;
        --added: #1d3322;
        --added-fg: #9fdcaa;
        --removed: #3a2220;
        --removed-fg: #f0a99e;
        --mark: #3a3418;
        --code-bg: #252b25;
        --scrim: rgba(0, 0, 0, 0.6);
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }
    [hidden] {
        display: none !important;
    }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--surface);
    }
    body.sheet-open {
        overflow: hidden;
    }
    .gutter {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    button {
        font: inherit;
        color: inherit;
    }
    button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    .meta {
        background: var(--surface);
        color: var(--muted);
        font-size: 0.78rem;
        padding-block: 10px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
    }
    .meta code {
        font-family: var(--font-mono);
        font-size: 0.76rem;
    }

    /* Sticky bar: the open file, its view, and its sections */
    nav.bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--surface);
        border-bottom: 1px solid var(--rule);
        padding-block: 8px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .file-button {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
    }
    .file-button .names {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }
    .file-button .title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.05rem;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .file-button .path {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .file-button svg {
        flex: none;
        color: var(--muted);
    }
    .seg {
        flex: none;
        display: inline-flex;
        border: 1px solid var(--rule);
        border-radius: 10px;
        overflow: hidden;
    }
    .seg button {
        border: 0;
        background: var(--surface);
        font-size: 0.8rem;
        padding: 10px 10px;
        cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--surface);
    }
    .sections {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .sections::-webkit-scrollbar {
        display: none;
    }
    .section-tab {
        flex: none;
        position: relative;
        border: 0;
        background: none;
        font-size: 0.85rem;
        color: var(--muted);
        padding: 6px 10px 10px;
        cursor: pointer;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
    }
    .section-tab[aria-selected="true"] {
        color: var(--fg);
        font-weight: 600;
        border-bottom-color: var(--accent);
    }
    .section-tab.has-changes::after {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 6px;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: middle;
    }

    /* The file sheet */
    .scrim {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--scrim);
    }
    .sheet {
        position: fixed;
        z-index: 21;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: calc(100% - 48px - env(safe-area-inset-top, 0px));
        background: var(--surface);
        border-radius: 16px 16px 0 0;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 720px) {
        .sheet {
            left: 50%;
            right: auto;
            bottom: auto;
            top: 10vh;
            width: 560px;
            transform: translateX(-50%);
            max-height: 80vh;
            border-radius: 16px;
        }
    }
    .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-block: 14px 10px;
        border-bottom: 1px solid var(--rule);
    }
    .sheet-head h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 1.1rem;
    }
    .filter {
        display: inline-flex;
        border: 1px solid var(--rule);
        border-radius: 999px;
        overflow: hidden;
    }
    .filter button {
        border: 0;
        background: var(--surface);
        font-size: 0.78rem;
        padding: 5px 12px;
        cursor: pointer;
    }
    .filter button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--fg);
        font-weight: 600;
    }
    .sheet-body {
        overflow-y: auto;
        padding-block: 4px 16px;
    }
    .group-name {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        padding: 14px 0 4px;
    }
    .file-option {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 8px;
        padding: 8px 8px;
        cursor: pointer;
    }
    .file-option:hover {
        background: var(--bg);
    }
    .file-option[aria-current="true"] {
        background: var(--accent-soft);
    }
    .file-option .names {
        flex: 1;
        min-width: 0;
    }
    .file-option .label {
        display: block;
        font-weight: 500;
    }
    .file-option .path {
        display: block;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
        overflow-wrap: anywhere;
    }
    .pill {
        flex: none;
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--mark);
        color: var(--fg);
    }
    .pill.new {
        background: var(--added);
        color: var(--added-fg);
    }

    main {
        padding-block: 16px 64px;
    }
    .doc {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .stat {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
    }
    .stat .add {
        color: var(--added-fg);
    }
    .stat .del {
        color: var(--removed-fg);
    }
    .pager {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 24px;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
    }
    .pager button {
        border: 1px solid var(--rule);
        background: var(--surface);

        text-align: left;

    .pager button.next {
        margin-left: auto;
        text-align: right;
    }
    .pager small {
        display: block;
        color: var(--muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    /* Rendered markdown */
    .md {
        min-width: 0;
    }
    .md > :first-child {

    }
    .md h1,
    .md h2 {
        font-family: var(--font-display);
        font-weight: 600;
        line-height: 1.2;
        text-wrap: balance;
    }
    .md h1 {
        font-size: 1.5rem;
        margin: 8px 0 4px;
    }
    .md h2 {
        font-size: 1.25rem;
        margin: 24px 0 6px;
    }
    .md h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 20px 0 4px;
    }
    .md p,
    .md li {
        max-width: 68ch;
    }
    .md ul,
    .md ol {
        padding-left: 1.3em;
    }
    .md li + li {
        margin-top: 4px;
    }
    .md a {
        color: var(--accent);
    }
    .md code {
        font-family: var(--font-mono);
        font-size: 0.86em;
        background: var(--code-bg);
        padding: 1px 4px;
        border-radius: 4px;
        overflow-wrap: anywhere;
    }
    .md pre {
        background: var(--code-bg);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        font-size: 0.8rem;
        line-height: 1.5;
    }
    .md pre code {
        background: none;
        padding: 0;
        overflow-wrap: normal;
    }
    .table-wrap {
        overflow-x: auto;
        margin-block: 8px;
    }
    .md table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.88rem;
    }
    .md th {
        text-align: left;
        font-weight: 600;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        border-bottom: 1px solid var(--rule);

    }
    .md td {
        border-bottom: 1px solid var(--rule);

    }
    .md td:first-child {

    }
    .changed {

    .md li.changed,

    }
    @media (max-width: 640px) {
        .md table.cards thead {
            display: none;
        }
        .md table.cards,
        .md table.cards tbody,
        .md table.cards tr,

        }
        .md table.cards tr {

            border: 0;

        }
        .md table.cards td[data-label]:not(:first-child)::before {
            content: attr(data-label);

            font-size: 0.68rem;
            text-transform: uppercase;

            color: var(--muted);

        .md table.cards td:empty,
        .md table.cards td.dash {
            display: none;

    }

    /* Diff view */
    .diff {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.5;
        background: var(--surface);

        overflow: hidden;

    .diff .ln {
        white-space: pre-wrap;
        overflow-wrap: anywhere;

    }
    .diff .ln.add {
        background: var(--added);
        color: var(--added-fg);
    }
    .diff .ln.del {

        color: var(--removed-fg);
    }
    .diff .ln.hunk {
        color: var(--muted);
        background: var(--code-bg);
        padding-block: 4px;
    }
</style>

<script type="application/json" id="review-data">
    /*__DATA__*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
    (() => {
        const data = JSON.parse(
            document.getElementById("review-data").textContent
        );
        const $ = (id) => document.getElementById(id);
        const main = $("main");
        const changed = data.docs.filter((doc) => doc.diff);
        const state = { docId: "", page: "", diff: false, changedOnly: false };

        const meta = $("meta");
        const metaItem = (label, value) => {
            const span = document.createElement("span");
            span.append(label + " ");
            const code = document.createElement("code");
            code.textContent = value;
            span.append(code);
            meta.append(span);
        };
        metaItem("", data.title);
        metaItem("Branch", data.branch);
        metaItem("Changes since", data.baseLabel);
        metaItem("At", data.head);

        const slug = (text) =>
            text
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "") || "section";

        const normalize = (text) =>
            text
                .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
                .replace(/[`*_|>#]/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();

        const rowKey = (cells) =>
            cells
                .map((c) => normalize(c))
                .filter(Boolean)
                .join(" ");

        const markChanged = (root, diff) => {
            const lines = diff.split("\n");
            const added = lines
                .filter((l) => l.startsWith("+") && !l.startsWith("+++"))
                .map((l) => normalize(l.slice(1)))
                .filter((l) => l.length > 12);
            const addedRows = new Set(
                lines
                    .filter((l) => l.startsWith("+|"))
                    .map((l) => rowKey(l.slice(1).split("|")))
            );
            root.querySelectorAll("tbody tr").forEach((tr) => {
                const cells = [...tr.children].map((td) => td.textContent);
                if (addedRows.has(rowKey(cells))) tr.classList.add("changed");
            });
            root.querySelectorAll("p, li, h2, h3").forEach((el) => {
                if (el.closest("table")) return;
                const own = normalize(el.textContent);
                if (own && added.some((line) => own.includes(line)))
                    el.classList.add("changed");
            });
        };

        const enhanceTables = (root) => {
            root.querySelectorAll("table").forEach((table) => {
                const wrap = document.createElement("div");
                wrap.className = "table-wrap";
                table.replaceWith(wrap);
                wrap.append(table);
                table.classList.add("cards");
                const headings = [...table.querySelectorAll("thead th")].map(
                    (th) => th.textContent.trim()
                );
                table.querySelectorAll("tbody tr").forEach((tr) => {
                    [...tr.children].forEach((td, i) => {
                        if (headings[i]) td.dataset.label = headings[i];
                        if (td.textContent.trim() === "—")
                            td.classList.add("dash");
                    });
                });
            });
        };

        /**
         * A file's pages: one per top-level section. A file with several
         * H1s splits on them; otherwise its title H1 is dropped (the bar
         * shows it) and it splits on H2s. What comes first is "Overview".
         */
        const paginate = (html) => {
            const body = document.createElement("div");
            body.innerHTML = html;
            const top = [...body.children];
            const h1s = top.filter((el) => el.tagName === "H1");
            let splitTag = "H1";
            if (h1s.length <= 1) {
                splitTag = "H2";
                if (h1s.length === 1 && top[0] === h1s[0]) h1s[0].remove();
            }
            const pages = [];
            let current = { title: "Overview", nodes: [] };
            for (const el of [...body.children]) {
                if (el.tagName === splitTag) {
                    if (current.nodes.some((n) => n.textContent.trim()))
                        pages.push(current);
                    current = { title: el.textContent.trim(), nodes: [] };
                    if (splitTag === "H1") {
                        const h2 = document.createElement("h2");
                        h2.innerHTML = el.innerHTML;
                        current.nodes.push(h2);
                    }
                    continue;
                }
                current.nodes.push(el);
            }
            if (current.nodes.some((n) => n.textContent.trim()))
                pages.push(current);
            const seen = new Map();
            for (const page of pages) {
                const base = slug(page.title);
                const count = seen.get(base) ?? 0;
                seen.set(base, count + 1);
                page.id = count ? `${base}-${count + 1}` : base;
            }
            return pages;
        };

        const renderDiff = (diff) => {
            const box = document.createElement("div");
            box.className = "diff";
            const lines = diff.split("\n");
            const start = lines.findIndex((l) => l.startsWith("@@"));
            for (const line of lines.slice(Math.max(start, 0))) {
                if (line === "\\ No newline at end of file") continue;
                const div = document.createElement("div");
                div.className =
                    "ln " +
                    (line.startsWith("@@")
                        ? "hunk"
                        : line.startsWith("+")
                          ? "add"
                          : line.startsWith("-")
                            ? "del"
                            : "");
                div.textContent = line || " ";
                box.append(div);
            }
            return box;
        };

        const diffStat = (diff) => {
            let add = 0;
            let del = 0;
            for (const l of diff.split("\n")) {
                if (l.startsWith("+") && !l.startsWith("+++")) add++;
                else if (l.startsWith("-") && !l.startsWith("---")) del++;
            }
            return { add, del };
        };

        // Built on first open: most files are never opened in a review.
        const built = new Map();
        const build = (doc) => {
            if (built.has(doc.id)) return built.get(doc.id);
            const html = marked.parse(doc.md);
            const pages = paginate(html);
            const root = document.createElement("section");
            root.className = "doc";
            // Never the hash itself, or the browser jumps to it.
            root.id = `file-${doc.id}`;

            const stat = document.createElement("div");
            stat.className = "stat";
            if (doc.isNew) {
                stat.innerHTML = `<span class="add">New on this branch · ${diffStat(doc.diff).add} lines</span>`;
            } else if (doc.diff) {
                const { add, del } = diffStat(doc.diff);
                stat.innerHTML = `Changed on this branch · <span class="add">+${add}</span> <span class="del">−${del}</span>, highlighted`;
            }
            if (doc.diff) root.append(stat);

            for (const [index, page] of pages.entries()) {
                const el = document.createElement("div");
                el.className = "md page";
                el.id = `file-${doc.id}--${page.id}`;
                el.append(...page.nodes);
                enhanceTables(el);
                if (doc.diff && !doc.isNew) markChanged(el, doc.diff);
                page.hasChanges = !!el.querySelector(".changed");
                if (pages.length > 1) el.append(pager(pages, index));
                page.el = el;
                root.append(el);
            }
            const diffView = doc.diff ? renderDiff(doc.diff) : undefined;
            if (diffView) root.append(diffView);
            main.append(root);
            const entry = { root, pages, diffView };
            built.set(doc.id, entry);
            return entry;
        };

        const pager = (pages, index) => {
            const nav = document.createElement("div");
            nav.className = "pager";
            const link = (page, label, cls) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = cls;
                button.innerHTML = `<small></small><span></span>`;
                button.querySelector("small").textContent = label;
                button.querySelector("span").textContent = page.title;
                button.addEventListener("click", () => {
                    open(state.docId, page.id);
                    window.scrollTo({ top: 0 });
                });
                return button;
            };
            if (index > 0)
                nav.append(link(pages[index - 1], "Previous", "prev"));
            if (index < pages.length - 1)
                nav.append(link(pages[index + 1], "Next", "next"));
            return nav;
        };

        const renderSections = (entry) => {
            const row = $("sections");
            row.innerHTML = "";
            row.hidden = state.diff || entry.pages.length < 2;
            for (const page of entry.pages) {
                const tab = document.createElement("button");
                tab.type = "button";
                tab.className = "section-tab";
                if (page.hasChanges) tab.classList.add("has-changes");
                tab.textContent = page.title;
                tab.setAttribute(
                    "aria-selected",
                    String(page.id === state.page)
                );
                tab.addEventListener("click", () => {
                    open(state.docId, page.id);
                    window.scrollTo({ top: 0 });
                });
                row.append(tab);
            }
            // By hand: scrollIntoView would scroll the page too.
            const selected = row.querySelector('[aria-selected="true"]');
            if (selected)
                row.scrollLeft =
                    selected.offsetLeft -
                    (row.clientWidth - selected.offsetWidth) / 2;
        };

        const open = (docId, pageId) => {
            const doc =
                data.docs.find((d) => d.id === docId) ||
                changed[0] ||
                data.docs[0];
            if (doc.id !== state.docId) state.diff = false;
            state.docId = doc.id;
            const entry = build(doc);
            const page =
                entry.pages.find((p) => p.id === pageId) ||
                entry.pages.find((p) => p.hasChanges) ||
                entry.pages[0];
            state.page = page ? page.id : "";

            for (const [id, other] of built) other.root.hidden = id !== doc.id;
            for (const p of entry.pages) p.el.hidden = state.diff || p !== page;
            if (entry.diffView) entry.diffView.hidden = !state.diff;

            $("file-title").textContent = doc.label;
            $("file-path").textContent = doc.path;
            $("file-path").hidden = doc.path === doc.label;
            $("view-toggle").hidden = !doc.diff;
            $("view-doc").setAttribute("aria-pressed", String(!state.diff));
            $("view-diff").setAttribute("aria-pressed", String(state.diff));
            renderSections(entry);

            const hash = state.page ? `${doc.id}--${state.page}` : doc.id;
            if (location.hash !== "#" + hash)
                history.replaceState(null, "", "#" + hash);
        };

        $("view-doc").addEventListener("click", () => {
            state.diff = false;
            open(state.docId, state.page);
        });
        $("view-diff").addEventListener("click", () => {
            state.diff = true;
            open(state.docId, state.page);
        });

        // The file sheet
        const sheetBody = $("sheet-body");
        const renderSheet = () => {
            sheetBody.innerHTML = "";
            $("filter-all").setAttribute(
                "aria-pressed",
                String(!state.changedOnly)
            );
            $("filter-changed").setAttribute(
                "aria-pressed",
                String(state.changedOnly)
            );
            $("filter-changed").textContent = `Changed (${changed.length})`;
            for (const groupName of data.groups) {
                const docs = data.docs.filter(
                    (d) =>
                        d.group === groupName && (!state.changedOnly || d.diff)
                );
                if (docs.length === 0) continue;
                const name = document.createElement("div");
                name.className = "group-name";
                name.textContent = groupName;
                sheetBody.append(name);
                for (const doc of docs) {
                    const option = document.createElement("button");
                    option.type = "button";
                    option.className = "file-option";
                    option.setAttribute(
                        "aria-current",
                        String(doc.id === state.docId)
                    );
                    const names = document.createElement("span");
                    names.className = "names";
                    const label = document.createElement("span");
                    label.className = "label";
                    label.textContent = doc.label;
                    const path = document.createElement("span");
                    path.className = "path";
                    path.textContent = doc.path;
                    names.append(label);
                    if (doc.path !== doc.label) names.append(path);
                    option.append(names);
                    if (doc.diff) {
                        const pill = document.createElement("span");
                        pill.className = doc.isNew ? "pill new" : "pill";
                        pill.textContent = doc.isNew ? "New" : "Changed";
                        option.append(pill);
                    }
                    option.addEventListener("click", () => {
                        closeSheet();
                        open(doc.id);
                        window.scrollTo({ top: 0 });
                    });
                    sheetBody.append(option);
                }
            }
        };
        const openSheet = () => {
            renderSheet();
            $("scrim").hidden = false;
            $("sheet").hidden = false;
            document.body.classList.add("sheet-open");
            sheetBody
                .querySelector('[aria-current="true"]')
                ?.scrollIntoView({ block: "center" });
        };
        const closeSheet = () => {
            $("scrim").hidden = true;
            $("sheet").hidden = true;
            document.body.classList.remove("sheet-open");
        };
        $("file-button").addEventListener("click", openSheet);
        $("scrim").addEventListener("click", closeSheet);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeSheet();
        });
        $("filter-all").addEventListener("click", () => {
            state.changedOnly = false;
            renderSheet();
        });
        $("filter-changed").addEventListener("click", () => {
            state.changedOnly = true;
            renderSheet();
        });

        const fromHash = () => {
            const [docId, pageId] = location.hash.slice(1).split("--");
            open(docId, pageId);
        };
        fromHash();
        window.addEventListener("hashchange", fromHash);
    })();
</script>
