<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@600&display=swap"
/>
<style>
    /* A reading desk: a sticky picker of every document, changed ones first, one open at a time. */
    :root {
        --bg: #f6f7f4;
        --surface: #ffffff;
        --fg: #1d221d;
        --muted: #5f6a60;
        --rule: #dfe3dc;
        --accent: #2f7d3b;
        --accent-soft: #e3f0e3;
        --added: #e6f4e6;
        --added-fg: #1f5f29;
        --removed: #fbe9e7;
        --removed-fg: #8a2a1e;
        --mark: #fff4cc;
        --code-bg: #eef1ec;
        --font-body:
            "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display:
            "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
        --font-mono:
            "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #151915;
            --surface: #1c211c;
            --fg: #e4e9e2;
            --muted: #9aa69a;
            --rule: #2e352e;
            --accent: #7cc489;
            --accent-soft: #24372a;
            --added: #1d3322;
            --added-fg: #9fdcaa;
            --removed: #3a2220;
            --removed-fg: #f0a99e;
            --mark: #3a3418;
            --code-bg: #252b25;
            color-scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #151915;
        --surface: #1c211c;
        --fg: #e4e9e2;
        --muted: #9aa69a;
        --rule: #2e352e;
        --accent: #7cc489;
        --accent-soft: #24372a;
        --added: #1d3322;
        --added-fg: #9fdcaa;
        --removed: #3a2220;
        --removed-fg: #f0a99e;
        --mark: #3a3418;
        --code-bg: #252b25;
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }
    [hidden] {
        display: none !important;
    }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--surface);
    }
    .gutter {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    header.masthead {
        background: var(--surface);
        padding-block: 16px 4px;
    }
    .masthead h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: 0.01em;
        margin: 0;
        text-wrap: balance;
    }
    .meta {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
    }
    .meta code {
        font-family: var(--font-mono);
        font-size: 0.78rem;
    }

    nav.picker {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--surface);
        border-bottom: 1px solid var(--rule);
        padding-block: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .picker select {
        width: 100%;
        max-width: 560px;
        font: inherit;
        font-size: 0.95rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 8px 10px;
    }
    .chip-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar {
        display: none;
    }
    .chip-label {
        flex: none;
        align-self: center;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
    }
    .chip {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--rule);
        background: var(--bg);
        color: var(--fg);
        border-radius: 999px;
        padding: 4px 10px;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
        white-space: nowrap;
    }
    .chip .kind {
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
    }
    .chip[aria-selected="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
    }
    .chip:focus-visible,
    .seg button:focus-visible,
    .picker select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    main {
        padding-block: 16px 64px;
    }
    .doc {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .doc-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .doc-path {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--muted);
        overflow-wrap: anywhere;
    }
    .stat {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
    }
    .stat .add {
        color: var(--added-fg);
    }
    .stat .del {
        color: var(--removed-fg);
    }
    .seg {
        display: inline-flex;
        border: 1px solid var(--rule);
        border-radius: 8px;
        overflow: hidden;
    }
    .seg button {
        border: 0;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 0.82rem;
        padding: 6px 12px;
        cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--surface);
    }
    .hint {
        font-size: 0.82rem;
        color: var(--muted);
        margin: 0;
    }

    /* Rendered markdown */
    .md {
        min-width: 0;
    }
    .md h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.6rem;
        line-height: 1.2;
        margin: 8px 0 4px;
        text-wrap: balance;
    }
    .md h2 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.2rem;
        margin: 28px 0 6px;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
        text-wrap: balance;
    }
    .md h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 20px 0 4px;
    }
    .md p,
    .md li {
        max-width: 68ch;
    }
    .md ul,
    .md ol {
        padding-left: 1.3em;
    }
    .md li + li {
        margin-top: 4px;
    }
    .md a {
        color: var(--accent);
    }
    .md code {
        font-family: var(--font-mono);
        font-size: 0.86em;
        background: var(--code-bg);
        padding: 1px 4px;
        border-radius: 4px;
        overflow-wrap: anywhere;
    }
    .md pre {
        background: var(--code-bg);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
        font-size: 0.8rem;
        line-height: 1.5;
    }
    .md pre code {
        background: none;
        padding: 0;
        overflow-wrap: normal;
    }
    .table-wrap {
        overflow-x: auto;
        margin-block: 8px;
    }
    .md table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.88rem;
    }
    .md th {
        text-align: left;
        font-weight: 600;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        border-bottom: 1px solid var(--rule);
        padding: 6px 8px;
    }
    .md td {
        border-bottom: 1px solid var(--rule);
        padding: 8px;
        vertical-align: top;
    }
    .md td:first-child {
        font-weight: 500;
    }
    .changed {
        background: var(--mark);
    }
    .md li.changed,
    .md p.changed {
        box-shadow: -8px 0 0 var(--mark);
    }

    /* Phone: rows become cards, each cell labelled by its heading. */
    @media (max-width: 640px) {
        .md table.cards thead {
            display: none;
        }
        .md table.cards,
        .md table.cards tbody,
        .md table.cards tr,
        .md table.cards td {
            display: block;
            width: 100%;
        }
        .md table.cards tr {
            border: 1px solid var(--rule);
            border-radius: 8px;
            background: var(--surface);
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        .md table.cards tr.changed {
            background: var(--mark);
        }
        .md table.cards td {
            border: 0;
            padding: 2px 0;
        }
        .md table.cards td[data-label]:not(:first-child)::before {
            content: attr(data-label);
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        .md table.cards td:empty,
        .md table.cards td.dash {
            display: none;
        }
    }

    /* Diff view */
    .diff {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        line-height: 1.5;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
        overflow: hidden;
    }
    .diff .ln {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 0 12px;
    }
    .diff .ln.add {
        background: var(--added);
        color: var(--added-fg);
    }
    .diff .ln.del {
        background: var(--removed);
        color: var(--removed-fg);
    }
    .diff .ln.hunk {
        color: var(--muted);
        background: var(--code-bg);
        padding-block: 4px;
    }
    @media (prefers-reduced-motion: no-preference) {
        .chip {
            transition:
                background 120ms ease,
                border-color 120ms ease;
        }
    }
</style>

<header class="masthead gutter">
    <h1 id="page-title"></h1>
    <div class="meta" id="meta"></div>
</header>
<nav class="picker gutter">
    <select id="picker"></select>
    <div class="chip-row" id="chips"></div>
</nav>
<main class="gutter" id="main"></main>

<script type="application/json" id="review-data">
    /*__DATA__*/
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
    (() => {
        const data = JSON.parse(
            document.getElementById("review-data").textContent
        );
        const main = document.getElementById("main");
        const picker = document.getElementById("picker");
        const chips = document.getElementById("chips");
        const changed = data.docs.filter((doc) => doc.diff);

        document.getElementById("page-title").textContent = data.title;
        const meta = document.getElementById("meta");
        const metaItem = (label, value) => {
            const span = document.createElement("span");
            span.append(label + " ");
            const code = document.createElement("code");
            code.textContent = value;
            span.append(code);
            meta.append(span);
        };
        metaItem("Branch", data.branch);
        metaItem("Changes since", data.baseLabel);
        metaItem("At", data.head);
        metaItem(
            "Changed",
            `${changed.length} of ${data.docs.length} documents`
        );

        const normalize = (text) =>
            text
                .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
                .replace(/[`*_|>#]/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();

        const rowKey = (cells) =>
            cells
                .map((c) => normalize(c))
                .filter(Boolean)
                .join(" ");

        const markChanged = (root, diff) => {
            const lines = diff.split("\n");
            const added = lines
                .filter((l) => l.startsWith("+") && !l.startsWith("+++"))
                .map((l) => normalize(l.slice(1)))
                .filter((l) => l.length > 12);
            const addedRows = new Set(
                lines
                    .filter((l) => l.startsWith("+|"))
                    .map((l) => rowKey(l.slice(1).split("|")))
            );
            root.querySelectorAll("tbody tr").forEach((tr) => {
                const cells = [...tr.children].map((td) => td.textContent);
                if (addedRows.has(rowKey(cells))) tr.classList.add("changed");
            });
            root.querySelectorAll("p, li, h2, h3").forEach((el) => {
                if (el.closest("table")) return;
                const own = normalize(el.textContent);
                if (own && added.some((line) => own.includes(line)))
                    el.classList.add("changed");
            });
        };

        const enhanceTables = (root) => {
            root.querySelectorAll("table").forEach((table) => {
                const wrap = document.createElement("div");
                wrap.className = "table-wrap";
                table.replaceWith(wrap);
                wrap.append(table);
                table.classList.add("cards");
                const headings = [...table.querySelectorAll("thead th")].map(
                    (th) => th.textContent.trim()
                );
                table.querySelectorAll("tbody tr").forEach((tr) => {
                    [...tr.children].forEach((td, i) => {
                        if (headings[i]) td.dataset.label = headings[i];
                        if (td.textContent.trim() === "—")
                            td.classList.add("dash");
                    });
                });
            });
        };

        const renderDiff = (diff) => {
            const box = document.createElement("div");
            box.className = "diff";
            const lines = diff.split("\n");
            const start = lines.findIndex((l) => l.startsWith("@@"));
            for (const line of lines.slice(Math.max(start, 0))) {
                if (line === "\\ No newline at end of file") continue;
                const div = document.createElement("div");
                div.className =
                    "ln " +
                    (line.startsWith("@@")
                        ? "hunk"
                        : line.startsWith("+")
                          ? "add"
                          : line.startsWith("-")
                            ? "del"
                            : "");
                div.textContent = line || " ";
                box.append(div);
            }
            return box;
        };

        const diffStat = (diff) => {
            let add = 0;
            let del = 0;
            for (const l of diff.split("\n")) {
                if (l.startsWith("+") && !l.startsWith("+++")) add++;
                else if (l.startsWith("-") && !l.startsWith("---")) del++;
            }
            return { add, del };
        };

        const panels = new Map();

        // Built on first open: most documents are never opened in a review.
        const buildPanel = (doc) => {
            const panel = document.createElement("section");
            panel.className = "doc";

            const bar = document.createElement("div");
            bar.className = "doc-bar";
            const left = document.createElement("div");
            const path = document.createElement("div");
            path.className = "doc-path";
            path.textContent = doc.path;
            const stat = document.createElement("div");
            stat.className = "stat";
            if (doc.isNew) {
                stat.innerHTML = `<span class="add">new · ${diffStat(doc.diff).add} lines</span>`;
            } else if (doc.diff) {
                const { add, del } = diffStat(doc.diff);
                stat.innerHTML = `<span class="add">+${add}</span> <span class="del">−${del}</span>`;
            } else {
                stat.textContent = "unchanged";
            }
            left.append(path, stat);
            bar.append(left);

            const body = document.createElement("div");
            body.className = "md";
            body.innerHTML = marked.parse(doc.md);
            enhanceTables(body);

            if (!doc.diff) {
                panel.append(bar, body);
                return panel;
            }

            if (!doc.isNew) markChanged(body, doc.diff);
            const changes = renderDiff(doc.diff);
            const seg = document.createElement("div");
            seg.className = "seg";
            const docBtn = document.createElement("button");
            docBtn.type = "button";
            docBtn.textContent = "Document";
            const diffBtn = document.createElement("button");
            diffBtn.type = "button";
            diffBtn.textContent = "Changes";
            seg.append(docBtn, diffBtn);
            bar.append(seg);
            const show = (isDiff) => {
                body.hidden = isDiff;
                changes.hidden = !isDiff;
                docBtn.setAttribute("aria-pressed", String(!isDiff));
                diffBtn.setAttribute("aria-pressed", String(isDiff));
            };
            docBtn.addEventListener("click", () => show(false));
            diffBtn.addEventListener("click", () => show(true));
            show(false);

            const hint = document.createElement("p");
            hint.className = "hint";
            hint.textContent = doc.isNew
                ? "New on this branch."
                : "Highlighted rows and paragraphs changed on this branch.";
            panel.append(bar, hint, body, changes);
            return panel;
        };

        const select = (id) => {
            const doc =
                data.docs.find((d) => d.id === id) ||
                changed[0] ||
                data.docs[0];
            if (!panels.has(doc.id)) {
                const panel = buildPanel(doc);
                panels.set(doc.id, panel);
                main.append(panel);
            }
            for (const [docId, panel] of panels)
                panel.hidden = docId !== doc.id;
            picker.value = doc.id;
            chips
                .querySelectorAll(".chip")
                .forEach((chip) =>
                    chip.setAttribute(
                        "aria-selected",
                        String(chip.dataset.id === doc.id)
                    )
                );
            if (location.hash !== "#" + doc.id)
                history.replaceState(null, "", "#" + doc.id);
        };

        const option = (doc, prefix) => {
            const el = document.createElement("option");
            el.value = doc.id;
            el.textContent = prefix + doc.label;
            return el;
        };
        if (changed.length > 0) {
            const group = document.createElement("optgroup");
            group.label = "Changed on this branch";
            for (const doc of changed)
                group.append(option(doc, doc.kind + ": "));
            picker.append(group);
        }
        for (const groupName of data.groups) {
            const group = document.createElement("optgroup");
            group.label = groupName;
            for (const doc of data.docs.filter((d) => d.group === groupName))
                group.append(option(doc, doc.diff ? "● " : ""));
            picker.append(group);
        }
        picker.addEventListener("change", () => {
            select(picker.value);
            window.scrollTo({ top: 0 });
        });

        if (changed.length > 0) {
            const label = document.createElement("span");
            label.className = "chip-label";
            label.textContent = "Changed";
            chips.append(label);
        } else {
            chips.hidden = true;
        }
        for (const doc of changed) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip";
            chip.dataset.id = doc.id;
            const kind = document.createElement("span");
            kind.className = "kind";
            kind.textContent = doc.kind;
            const name = document.createElement("span");
            name.textContent = doc.label;
            chip.append(kind, name);
            chip.addEventListener("click", () => {
                select(doc.id);
                window.scrollTo({ top: 0 });
            });
            chips.append(chip);
        }

        select(location.hash.slice(1));
        window.addEventListener("hashchange", () =>
            select(location.hash.slice(1))
        );
    })();
</script>
