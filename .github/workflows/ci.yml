name: CI

on:
    pull_request:
    # Pushes to cert and main run the same check as the gate in deploy.yml.

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Everything a change must pass, defined once in package.json.
            - name: Check
              run: npm run check
