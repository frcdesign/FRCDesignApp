name: CI

on:
  pull_request:
  push:
    branches: [cert]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
