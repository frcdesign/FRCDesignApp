name: Deploy

on:
    push:
        branches: [cert, main]

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The same check as ci.yml, before any deploy.
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check
              run: npm run check

    # One job for both targets, so cert deploys exactly as production does.
    # `environment` can't read `env`, so it repeats the choice. Production's
    # GitHub Environment can require a reviewer.
    deploy:
        needs: ci
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'production' || 'cert' }}
        env:
            TARGET: ${{ github.ref_name == 'main' && 'production' || 'cert' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # The @cloudflare/vite-plugin picks the Worker at build time from
            # CLOUDFLARE_ENV, and writes the config `wrangler deploy` reads.
            - name: Build
              run: npm run build
              env:
                  CLOUDFLARE_ENV: ${{ env.TARGET }}

            # Cloudflare's advice for version skew: a tab open on the last
            # release still finds the chunks it lazy-loads.
            - name: Keep this release's assets apart
              run: cp -R dist/client/assets .own-assets

            - name: Restore the previous release's assets
              uses: actions/cache/restore@v4
              with:
                  path: .release-assets
                  key: release-assets-${{ env.TARGET }}-${{ github.sha }}
                  restore-keys: release-assets-${{ env.TARGET }}-

            - name: Ship the previous release's assets beside this one's
              run: |
                  if [ -d .release-assets ]; then
                      cp -Rn .release-assets/. dist/client/assets/
                  fi

            - name: Apply migrations & deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  preCommands: wrangler d1 migrations apply DB --remote --env ${{ env.TARGET }}
                  command: deploy

            - name: Remember this release's assets for the next deploy
              run: rm -rf .release-assets && mv .own-assets .release-assets

            - uses: actions/cache/save@v4
              with:
                  path: .release-assets
                  key: release-assets-${{ env.TARGET }}-${{ github.sha }}
